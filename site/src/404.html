<!doctype html>
<html lang="{{_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{nf_title}} · OrthoAutoAI</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f15">
  <link rel="icon" href="{{_root}}favicon.ico" sizes="48x48">
  <link rel="stylesheet" href="{{_root}}css/style.css?v={{_css_hash}}">
</head>
<body class="nf">
  <main class="nf__main">
    <a class="brand" href="{{_home}}">
      <img src="{{_root}}assets/logo-64.png" width="32" height="32" alt="">
      <span>OrthoAutoAI</span>
    </a>
    <p class="nf__code" aria-hidden="true">404</p>
    <h1>{{nf_title}}</h1>
    <p>{{nf_text}}</p>
    <a class="btn btn--primary" href="{{_home}}">{{nf_back}}</a>
    <ul class="site-footer__langs" aria-label="{{nav_language}}">
{{{_lang_links}}}
    </ul>
  </main>
</body>
</html>
